# Production overlay: persistent Qdrant storage, restart policies, env-file config.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
services:
  api:
    environment:
      - APP_ENV=production
      - DEBUG=false
    # Optional: copy .env.production.example -> .env.production to override.
    env_file:
      - path: .env.production
        required: false
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - model_cache:/home/appuser/.cache/huggingface
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model_cache:
