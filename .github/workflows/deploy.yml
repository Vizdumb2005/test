name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  QDRANT_URL: https://773125ea-efc2-4c2c-81dd-9b4be54c5a66.europe-west6-0.gcp.cloud.qdrant.io
  BACKEND_PORT: 8000
  APP_DIR: /opt/enterprise-rag

jobs:
  # ------------------------------------------------------------------ #
  # Frontend: build + push Docker image to GHCR
  # ------------------------------------------------------------------ #
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static bundle (same-origin, served by nginx on Oracle)
        run: npm run build

      - name: Set image tag (lowercase owner for GHCR)
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%/*}" | tr '[:upper:]' '[:lower:]')
          echo "FRONTEND_IMAGE=ghcr.io/$OWNER/test/enterprise-rag-frontend:latest" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=ghcr.io/$OWNER/test/enterprise-rag:latest" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

      - name: Make frontend package publicly readable
        run: |
          gh api -X PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/docker/test/enterprise-rag-frontend/visibility \
            -f visibility='public' 2>/dev/null || true
          echo "Frontend package visibility set (any errors are non-fatal)"

  # ------------------------------------------------------------------ #
  # Backend: build + push to GHCR (server pulls from registry)
  # ------------------------------------------------------------------ #
  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (lowercase owner for GHCR)
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%/*}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/test/enterprise-rag:latest" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Make package publicly readable
        run: |
          gh api -X PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/docker/test/enterprise-rag/visibility \
            -f visibility='public' 2>/dev/null || true
          echo "Package visibility set (any errors are non-fatal)"

  # ------------------------------------------------------------------ #
  # Oracle VM: SSH deploy + permanent URL
  # ------------------------------------------------------------------ #
  oracle-deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, deploy-backend]
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USERNAME: ${{ secrets.ORACLE_USERNAME || 'opc' }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure SSH key and known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -p 22 "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy deploy script to Oracle
        run: |
          scp -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no scripts/deploy-to-oracle.sh "$ORACLE_USERNAME@$ORACLE_HOST:/tmp/deploy-to-oracle.sh"

      - name: Run deployment on Oracle
        run: |
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no "$ORACLE_USERNAME@$ORACLE_HOST" 'bash /tmp/deploy-to-oracle.sh'

      - name: Resolve permanent public URL
        id: url
        run: |
          PUBLIC_IP=$(ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no "$ORACLE_USERNAME@$ORACLE_HOST" 'curl -s ifconfig.me')
          echo "url=http://$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "api_url=http://$PUBLIC_IP:8000" >> $GITHUB_OUTPUT
          echo "docs_url=http://$PUBLIC_IP:8000/docs" >> $GITHUB_OUTPUT
          echo "Resolved public URL: http://$PUBLIC_IP"

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** ${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**API:** ${{ steps.url.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docs:** ${{ steps.url.outputs.docs_url }}" >> $GITHUB_STEP_SUMMARY
